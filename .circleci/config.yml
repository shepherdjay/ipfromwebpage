version: 2.1

orbs:
  python: circleci/python@3.3.0
  codecov: codecov/codecov@5.4.3

jobs:
  build-and-test:
    parameters:
      python-version:
        type: string
    executor: 
      name: python/default
      tag: << parameters.python-version >>
    steps:
      - checkout
      - python/install-packages:
          pkg-manager: uv
      - run: uv run pytest --cov --cov-report=html --cov-report=xml --junitxml=junit.xml -o junit_family=legacy
      - codecov/upload: 
          files: ./coverage.xml
          report_type: "coverage"
      - codecov/upload: 
          files: ./junit.xml
          report_type: "test_results"
      - store_artifacts:
          path: htmlcov
  pypi_publish:
    executor: 
      name: python/default
      tag: "3.10"
    steps:
      - checkout
      - python/install-packages:
          pkg-manager: uv
      - run: uv build && uv publish -u $PYPI_USERNAME -p $PYPI_PASSWORD

workflows:
  main:
    jobs:
      - build-and-test:
          matrix:
            parameters:
              python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
      - pypi_publish:
          filters:
            branches:
              ignore: /.*/
            tags:
              only: /^v.*/

