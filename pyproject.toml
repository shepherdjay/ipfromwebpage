[project]
name = "ipfromwebpage"
version = "1.3.0"
description = "Takes a webpage and outputs all ip addresses it finds"
authors = [{ name = "Jay Shepherd", email = "shepherdjay@users.noreply.github.com" }]
requires-python = ">=3.10"
readme = "README.md"
license = "MIT"
keywords = ["ipfromwebpage"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",    
    "Programming Language :: Python :: 3.14",    
]
dependencies = [
    "beautifulsoup4>=4.4,<5",
    "netaddr>=0.8.0,<0.9",
]

[project.urls]
Homepage = "https://github.com/shepherdjay/ip-from-webpage"
Repository = "https://github.com/shepherdjay/ip-from-webpage"

[project.scripts]
ipfromwebpage = "ipfromwebpage:entrypoint"

[dependency-groups]
dev = [
    "pytest>=7.3,<8",
    "pytest-cov",
]

[build-system]
requires = ["uv_build>=0.9.17,<0.10.0"]
build-backend = "uv_build"
